name: macOS
on: [push, pull_request]
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit and protocol integration tests (no model calls)
        run: swift test --enable-code-coverage
      - name: Native app bundle
        run: ./Scripts/package-release.sh
      - name: Validate bundle
        run: codesign --verify --strict build/NotchCraft.app
      - uses: actions/upload-artifact@v4
        with:
          name: NotchCraft-macos
          path: build/NotchCraft-0.1.0-macos.zip
